services:
  harvey:
    build: .
    env_file: .env
    stdin_open: true
    tty: true
    ports:
      - "5555:5555"
    volumes:
      # Persist database across restarts
      - ./data:/app/data
      # Mount config, code and env for easy editing without rebuild
      - ./.env:/app/.env:ro
      - ./harvey.yaml:/app/harvey.yaml:ro
      - ./harvey:/app/harvey
      - ./prompts:/app/prompts:ro
      - ./skills:/app/skills
      # Antigravity CLI (agy) credentials and settings
      - ~/.gemini:/home/harvey/.gemini
    restart: unless-stopped
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
